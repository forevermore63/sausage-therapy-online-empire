<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NDIS intake — Sausage Therapy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#102018;--cream:#f6f0e4;--leaf:#1f4a34;--card:#fffdf8;--line:#e4d8c0}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 70px}h1,.brand{font-family:Fraunces,Georgia,serif}
a{color:var(--leaf)}.btn{display:inline-block;background:var(--leaf);color:#fff;text-decoration:none;padding:12px 18px;border-radius:999px;font-weight:700;border:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
label{display:block;font-weight:600;margin:12px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
</style></head><body>
<div class="wrap">
<p class="brand"><a href="index.html">← Sausage Therapy</a></p>
<p style="letter-spacing:.12em;text-transform:uppercase;font-size:.75rem;font-weight:700;color:var(--leaf)">NEW · PLAN-FRIENDLY</p>
<h1>NDIS intake</h1>
<p>Write it once. We keep the goals, support category, travel and dog notes so you never retell the whole story for a booking.</p>
<div class="card">
<form onsubmit="event.preventDefault();alert('Intake stored in this browser for now. Email or PayID reference ties it to the booking desk.');">
<label>Participant name</label><input required/>
<label>Plan manager / self / NDIA</label>
<select><option>Plan managed</option><option>Self managed</option><option>NDIA managed</option><option>Not sure yet</option></select>
<label>Support category (if known)</label><input placeholder="e.g. Improved Daily Living / Social and Community"/>
<label>Goals in one paragraph</label><textarea rows="4"></textarea>
<label>Sensory / access notes</label><textarea rows="3"></textarea>
<label>Preferred place</label>
<select><option>Forevermore Farm</option><option>Mobile / home</option><option>Corporate site</option><option>Other hinterland</option></select>
<label>Contact email</label><input type="email" required/>
<p><button class="btn" type="submit">Save intake</button></p>
</form>
</div>
<p><a href="book.html">Booking desk</a> · This is not a substitute for a registered provider quote.</p>
</div></body></html>
