<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Book Sausage Therapy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#102018;--cream:#f6f0e4;--gold:#c9a24a;--leaf:#1f4a34;--card:#fffdf8;--line:#e4d8c0}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Source Sans 3",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px}h1{font-family:Fraunces,serif}
a{color:var(--leaf)}label{display:block;margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
button{margin-top:16px;background:var(--leaf);color:#fff;border:0;padding:12px 20px;border-radius:999px;font-weight:700;cursor:pointer}
.nav{margin-bottom:20px}.ok{display:none;background:#e8f5ee;padding:14px;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← Home</a></div>
  <h1>Book a session</h1>
  <p>Individual from $150 · Corporate from $450 · NDIS-friendly. Mobile Gold Coast / Noosa and hinterland farm days.</p>
  <form id="f" onsubmit="event.preventDefault();this.style.display='none';document.getElementById('ok').style.display='block'">
    <label>Name</label><input required name="name"/>
    <label>Email</label><input required type="email" name="email"/>
    <label>Phone</label><input name="phone"/>
    <label>Session type</label>
    <select name="type">
      <option>Individual / family (45–60 min)</option>
      <option>NDIS-supported session</option>
      <option>Corporate / group</option>
      <option>Forevermore Farm day</option>
      <option>SNOUTSAIL boat</option>
    </select>
    <label>Preferred dates / notes</label>
    <textarea name="notes" rows="4" placeholder="Location, NDIS plan notes, pack preferences..."></textarea>
    <button type="submit">Send booking request</button>
  </form>
  <div class="ok" id="ok">Received. Email emily via the live pages or @TherapySausages to lock the slot. This form is ready to hook to Formspree / Remix action / Gmail.</div>
</div>
</body>
</html>
